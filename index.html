<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Heart Love</title>

<style>
body {
  margin: 0;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
}

.container {
  position: relative;
  width: 800px;
  height: 800px;
}

.ui_love_word {
  position: absolute;
  color: #e96fca;
  font-size: 22px;
  font-family: Arial, sans-serif;
  font-weight: bold;
  text-shadow: 0 0 15px #f3b6df, 0 0 25px #ffb3d9;

 
  white-space: nowrap;          
  transform: translate(-50%, -50%); 

  opacity: 0;
  animation: flow 6s linear infinite;
}

@keyframes flow {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
  15% { opacity: 1; }
  85% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1.2); }
}
</style>

</head>
<audio id="music" loop>
  <source src="LoveUProyect.mp3" type="audio/mpeg">
</audio>

<script>
window.addEventListener("click", () => {
  const audio = document.getElementById("music");
  audio.play();
}, { once: true });
</script>
<body>

<div class="container" id="heart"></div>

<script>
const container = document.getElementById("heart");

let points = [];

// generar puntos del corazón
for (let t = 0; t < Math.PI * 2; t += 0.1) {
  let x = 16 * Math.pow(Math.sin(t), 3);
  let y = 13 * Math.cos(t)
          - 5 * Math.cos(2*t)
          - 2 * Math.cos(3*t)
          - Math.cos(4*t);

  points.push({x, y});
}

// render limpio
points.forEach((p, index) => {
  let el = document.createElement("div");
  el.className = "ui_love_word";
  el.innerText = "I love you"; 

  el.style.left = (400 + p.x * 20) + "px";
  el.style.top = (400 - p.y * 20) + "px";

  el.style.animationDelay = (index * 0.05) + "s";

  container.appendChild(el);
});
</script>

</body>
</html>
